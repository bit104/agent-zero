services:
  agent-zero:
    container_name: agent-zero
    image: agent0ai/agent-zero:latest
    volumes:
      - ./agent-zero:/a0
      # 成果物や作業コードの共有用ディレクトリ
      - ./workspace:/a0/usr/workdir
    ports:
      - "50080:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
